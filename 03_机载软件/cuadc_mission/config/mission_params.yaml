# CUADC 任务状态机参数（M1 能飞 + M3 能投）
#
# 数值基线出处：总体方案与执行计划.md（SSOT）§5.2/§5.4 —— HIT 实测值，
# 按我们平台实测后修订；场地几何为占位值，按赛场实测/规则修订。
# 代码对每个参数都有下限保护（见 src/mission_node.cpp 的 load_parameters）。
# 顶层键 = 节点名（launch 里 name: cuadc_mission），改节点名必须同步改这里。

cuadc_mission:
  ros__parameters:
    # ---- 模式 ----
    m1_no_vision_mode: true       # M1 演练：SEARCH 飞完预设航线即转侦察段（跳过对准/投放）。正式飞行必须改 false
    auto_arm_on_guided: false     # GUIDED 后是否自动解锁；false = 飞手手动解锁（默认，更安全）

    # ---- 高度（m，相对起飞点）----
    takeoff_alt_m: 4.0            # 起飞/返航 4.0（SSOT §5.4）
    search_alt_m: 2.0             # 搜索 2.0（4.2m 检不出桶，勿改高）
    recon_alt_m: 4.0              # 侦察巡航高度（SSOT 未定值，待实测标定）
    return_alt_m: 4.0

    # ---- 速度（m/s）----
    transit_speed_m_s: 4.0        # 转场/爬升/返航
    search_speed_m_s: 2.0         # 搜索
    recon_speed_m_s: 3.0          # 侦察

    waypoint_accept_radius_m: 0.40   # 航点接受半径

    # ---- 航向锁定（LOCK_FRAME：2s 内变化 ≤2° 才锁坐标系）----
    heading_lock_window_s: 2.0
    heading_lock_tol_deg: 2.0
    heading_lock_timeout_s: 30.0     # 锁不上（罗盘漂移）超时判失败

    # ---- 超时 ----
    prestream_hold_s: 1.5            # 切 GUIDED 前预发 setpoint 时长
    takeoff_timeout_s: 60.0
    mission_timeout_s: 240.0         # 任务总超时（比赛 5 分钟）
    odom_timeout_s: 1.0              # odom 断流 >1s 视为过期（SSOT §10.2-8）
    recon_photo_timeout_s: 1.0       # 每视点拍照确认等待兜底

    # ---- 降落确认（LAND/DISARM：≤0.30m + 速度门限 + 稳定 1.5s 才算落地）----
    landing_confirm_s: 1.5
    landing_alt_gate_m: 0.30
    landing_hspeed_gate_m_s: 0.20
    landing_vspeed_gate_m_s: 0.15

    # ---- 场地几何（场地坐标系：原点=起飞点，x 朝起飞时机头方向）----
    # 仿真场地取值（RULE_MAPPING.md：投放区中心(30,0) x向5m/y向8m；侦察区中心(55,0)同尺寸）。
    # 世界文件出生机头=yaw0 朝 +X，与场地前进方向一致（2026-09-12 修复"横着搜"）。
    # 上真机时按赛场实测修订。
    search_x_min_m: 27.5            # 投放区 X 范围（中心 30 ± 2.5）
    search_x_max_m: 32.5
    search_half_width_m: 4.0        # 投放区半宽（Y 方向 ±4，区宽 8m）
    search_lanes: 6                 # 搜索带数（弓字形）。2m 高相机横向半覆盖≈1.05m
                                    # （hfov1.5rad/848×480），6 带间距 1.6m 无盲区；
                                    # 4 带间距 2.67m 有 0.28m 盲区（09-12 覆盖计算）
    search_degrade_timeout_s: 60.0  # SEARCH 进行此时长仍无 3 筒锁定 → 提前按
                                    # "2筒+1未知"降级（SSOT P4-3），不等航线尽头
    search_settle_s: 8.0            # SEARCH 沉降期：起飞后 EKF 飞行中罗盘对齐期间
                                    # 不喂图（防 yaw 漂移凑出假航迹锁错目标，真视觉排障）
    recon_x_m: 52.5                 # 侦察区起始 X（中心 55 ± 2.5）
    recon_lane_len_m: 5.0           # 侦察带位沿 X 分布跨度（09-12 起带沿 Y 长轴扫，
                                    # 此值=带位均布范围；旧语义"带长"已弃）
    recon_half_width_m: 4.0         # 侦察区半宽（Y 方向 ±4，即每条带扫描长度 8m）
    recon_lanes: 3                  # 侦察带数 ×2 端点 = 6 航点（SSOT §5.1 蛇形6航点）

    vision_takeoff_min_frames: 3    # 视觉起飞门禁：起飞前 ≥N 帧有效（SSOT §5.4；
                                    # 0=关闭；m1_no_vision 模式不生效）

    # ---- ALIGN/RELEASE 速度伺服（SSOT §5.2-209；默认关=位置 setpoint 对准）----
    align_servo_enabled: false      # M2 真感知接入实测后置 true（SITL 先验符号约定）
    align_servo_kp: 1.0             # 世界系比例增益 (m/s)/m；SSOT 的 0.003px→m/s
                                    # 属感知层，世界系等效值按检测距离换算
    align_servo_max_align_m_s: 0.8  # 对准段水平限幅（SSOT §5.2-209）
    align_servo_max_release_m_s: 0.25  # 释放定位段水平限幅（SSOT §5.4）
    align_servo_deadzone_m: 0.02    # 死区（等效 SSOT 5px @1.8m）
    align_servo_watchdog_s: 0.5     # 目标失新看护：超时回退位置保持

    # ---- 仿真投放判分桥（仅 SITL；真机必须 false）----
    sim_release_bridge: false       # RELEASE fire 同步调 /drop_controller/release，
                                    # 虚拟判定节点按此刻位置判 A/B 区（fc_sitl_m3.sh 置 true）

    # ---- 时间同步（P0.4，SSOT §4.3 容差照抄，设计见 03_机载软件/时间同步设计.md）----
    perception_max_delay_s: 1.5      # 感知管线延迟上界：帧龄超此值丢弃
    odom_future_tol_s: 0.05          # 未来戳容差：超此值视为时钟错乱丢弃
    odom_interp_max_gap_s: 0.2       # 包围两帧最大间隔：断流段内不插值
    odom_history_span_s: 3.0         # odom 历史时间窗

    # ==== M3 感知契约（接口契约.md §1；哨兵不符整帧拒用）====
    expected_frame_id: cuadc_body_flu
    contract_version: 1.0            # orientation.z 哨兵
    min_detection_confidence: 0.25   # 感知端质量分下限

    # ==== M3 锁定五步（SSOT §5.2/§5.4；防线细节见 tools/drop_logic.py）====
    lock_min_confirm_frames: 5       # ≥5 帧确认
    lock_fresh_window_s: 60.0        # 锁定航迹新鲜窗（建图级）：hpp 默认 1.0s 只适合
                                     # HIT 密集桶位（3 筒同视野）；桶距 2~5m 逐带经过时
                                     # 三筒须先后入图再统一锁定。桶静止，长窗无风险；
                                     # RELEASE 反盲投由 release_max_target_age 单独把守
    lock_assoc_gate_m: 0.50          # 检测-航迹关联门（须 < 最小筒间距）
    lock_ema_alpha: 0.25             # 位置 EMA
    lock_diameter_window: 9          # 直径中位窗
    lock_jitter_gate_m: 0.15         # 确认时世界系位置抖动门
    lock_min_spacing_m: 0.20         # 独立性门控：间距（HIT 两瓶投一点防线）
    lock_min_diameter_diff_m: 0.025  # 独立性门控：直径差
    lock_diameter_min_m: 0.08        # 物理先验（免费一致性校验）
    lock_diameter_max_m: 0.35
    lock_diameter_match_tol_m: 0.035 # 15/20/25cm 对号容差
    lock_rank_stable_s: 0.8          # 排名稳定才冻结
    lock_blacklist_radius_m: 0.25    # 已投/已弃拉黑半径
    lock_blacklist_window_s: 120.0   # 拉黑时长

    # ==== M3 对准（SSOT §5.4：粗/精 0.15/0.08，稳定 0.8s，超时 12s）====
    align_alt_m: 1.8
    align_coarse_radius_m: 0.15
    align_fine_radius_m: 0.08
    align_stable_s: 0.8
    align_timeout_s: 12.0

    # ==== M3 释放八门控（SSOT §5.2；含反盲投 target_age）====
    release_max_horiz_err_m: 0.10
    release_max_vert_err_m: 0.10
    release_max_hspeed_m_s: 0.08
    release_max_vspeed_m_s: 0.05
    release_max_tilt_deg: 5.0
    release_max_yaw_err_deg: 5.0
    release_stability_s: 0.8         # 连续无违约稳定
    release_hold_s: 1.5              # 稳定后再保持（合计连续 2.3s）
    release_gate_timeout_s: 6.0      # 进 RELEASE 起 6s 未凑齐 → 弃桶
    release_max_target_age_s: 0.5    # 反盲投：目标估计超龄禁投
    release_max_lead_m: 0.15         # 弹道前移 sanity 上限
    align_lost_fresh_s: 1.0          # ALIGN 段 tracker 丢目标判定窗（转场 2~5m 途中
                                     # 目标暂出视野属正常，不能沿用 0.5s 反盲投窗）
    align_reacquire_window_s: 4.0    # 丢目标后重捕获等待窗（合计容忍 ≈5s 到达目标）

    # ==== M3 载荷与舵机 ====
    drop_order: conservative         # conservative=先大筒保底 / aggressive=先小筒冲 800
    payload_offset_1: [0.0, 0.0]     # 投放口偏置(机体系 x前 y左, m)——SSOT §6 两步法标定后填
    payload_offset_2: [0.0, 0.0]
    servo_channel_1: 9               # AUX1..4 对应 SERVO9..12
    servo_channel_2: 10
    servo_stowed_pwm: 1100.0         # 收拢
    servo_release_pwm: 1900.0        # 释放
    enable_release_output: false     # 干跑开关：false 只打日志不发舵机（实弹改 true）
